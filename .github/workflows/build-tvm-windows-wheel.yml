name: build-tvm-windows-wheel

on:
  workflow_dispatch:

env:
  LLVM_VERSION: "21.1.8"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      HASH: ${{ steps.tvm.outputs.HASH }}
      SHORT_SHA: ${{ steps.tvm.outputs.SHORT_SHA }}
      DATE_JST:  ${{ steps.date.outputs.DATE_JST }}
      DATE_JST_COMPACT: ${{ steps.date.outputs.DATE_JST_COMPACT }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: tvm
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: 'apache',
              repo: 'tvm',
              ref: 'heads/main',
            });
            core.setOutput('HASH', data.object.sha);
            core.setOutput('SHORT_SHA', data.object.sha.substring(0,8));
      - id: date
        run: |
          echo "DATE_JST=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "DATE_JST_COMPACT=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: 'apache/tvm'
          ref: ${{ needs.meta.outputs.HASH }}
          # setuptools-scm needs the history/tags of TVM and its FFI submodule.
          fetch-depth: 0
          submodules: recursive
          github-server-url: https://github.com

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        # Use uv's stable CPython distribution for Python 3.15.
        if: matrix.python-version != '3.15'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        env:
          UV_MANAGED_PYTHON: ${{ matrix.python-version == '3.15' && 'true' || 'false' }}
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Verify build Python
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          requested = tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
          print(sys.version)
          assert sys.version_info[:2] == requested, "Unexpected Python version"
          assert sys.version_info.releaselevel == "final", "A stable Python release is required"
          PY

      - name: Download official LLVM archive (Windows)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/clang%2Bllvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz
          7z x llvm.tar.xz -y | Out-Null
          7z x llvm.tar -y -ollvm | Out-Null
          $llvmRoot = (Get-ChildItem llvm | Where-Object { $_.PSIsContainer } | Select-Object -First 1).FullName
          $llvmRootUnix = $llvmRoot -replace '\\','/'
          $llvmDir = (Resolve-Path "$llvmRoot\lib\cmake\llvm").Path -replace '\\','/'
          "LLVM_ROOT=$llvmRootUnix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "LLVM_ROOT=$llvmRootUnix"
          Write-Host "LLVM_DIR=$llvmDir"

      - name: Install dependencies (Windows)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv pip install -U pip numpy cmake ninja wheel cython build setuptools

      - name: Build LLVM's libxml2 dependency (Windows)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri https://github.com/GNOME/libxml2/archive/refs/tags/v2.9.12.tar.gz -OutFile libxml2.tar.gz
          tar xf libxml2.tar.gz

          # Match llvmorg-21.1.8/llvm/utils/release/build_llvm_release.bat.
          $libxmlArgs = @(
            '-DCMAKE_BUILD_TYPE=Release'
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/libxml2-install"
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
            '-DBUILD_SHARED_LIBS=OFF'
            '-DLIBXML2_WITH_OUTPUT=ON'
            '-DLIBXML2_WITH_THREADS=ON'
            '-DLIBXML2_WITH_TREE=ON'
          )
          $disabledFeatures = @(
            'C14N', 'CATALOG', 'DEBUG', 'DOCB', 'FTP', 'HTML', 'HTTP', 'ICONV',
            'ICU', 'ISO8859X', 'LEGACY', 'LZMA', 'MEM_DEBUG', 'MODULES', 'PATTERN',
            'PROGRAMS', 'PUSH', 'PYTHON', 'READER', 'REGEXPS', 'RUN_DEBUG', 'SAX1',
            'SCHEMAS', 'SCHEMATRON', 'TESTS', 'THREAD_ALLOC', 'VALID', 'WRITER',
            'XINCLUDE', 'XPATH', 'XPTR', 'ZLIB'
          )
          $libxmlArgs += $disabledFeatures | ForEach-Object { "-DLIBXML2_WITH_$_=OFF" }
          cmake -S libxml2-2.9.12 -B libxml2-build -A x64 @libxmlArgs
          cmake --build libxml2-build --config Release --target install --parallel
          Copy-Item libxml2-install/lib/libxml2s.lib "$env:LLVM_ROOT/lib/libxml2s.lib"

      - name: Build python packages (Windows)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'An x64 MSVC toolchain is required' }
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:CMAKE_BUILD_PARALLEL_LEVEL = '4'
          # LLVM/libxml2 use /MT; the prebuilt static Z3 wheel uses /MD.
          $cmakeArgs = "-GNinja;-DUSE_LLVM=ON;-DLLVM_DIR=$env:LLVM_DIR;-DUSE_MLIR=OFF;-DUSE_Z3=OFF;-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          uv build --wheel . --config-settings "cmake.args=$cmakeArgs" --verbose
          uv build --wheel 3rdparty/tvm-ffi/ --verbose

      - name: Test TVM
        shell: bash
        env:
          TVM_TEST_TARGETS: "llvm"
          TVM_WHEEL_EXPECT_LLVM: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          mkdir tmp
          cp 3rdparty/tvm-ffi/dist/apache_tvm_ffi-*.whl dist/apache_tvm-*.whl tmp
          cd tmp
          uv venv .test-venv --python "$PYTHON_VERSION"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test_python=".test-venv/Scripts/python.exe"
          else
            test_python=".test-venv/bin/python"
          fi
          uv pip install --python "$test_python" pytest apache_tvm_ffi-*.whl apache_tvm-*.whl
          uv pip check --python "$test_python"
          "$test_python" -c "import tvm, tvm_ffi; print(tvm.__file__); print(tvm_ffi.__file__); print(tvm.__version__); tvm.support.describe(); assert tvm.runtime.enabled('llvm'), 'LLVM support is required'"
          "$test_python" -m pytest -v "../tests/python/all-platform-minimal-test"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tvm-wheel-windows-amd64-py${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/apache_tvm-*.whl
            3rdparty/tvm-ffi/dist/apache_tvm_ffi-*.whl
